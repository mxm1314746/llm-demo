# ============================================
# docker-compose.yml
# 启动方式: docker-compose up -d
# ============================================
version: "3.9"

services:
  travel-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csair-travel-agent
    ports:
      - "7864:7864"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - MODEL_NAME=${MODEL_NAME:-deepseek-chat}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./env:/app/env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7864')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
